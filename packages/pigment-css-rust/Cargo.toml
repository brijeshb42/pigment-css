[package]
edition = "2021"
name = "pigment_css"
version = "0.0.1"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Default enable napi4 feature, see https://nodejs.org/api/n-api.html#node-api-version-matrix
napi = { version = "2.12.2", default-features = false, features = ["napi4"] }
napi-derive = "2.12.2"
oxc = "0.61.2"
oxc_ast = "0.61.2"
oxc_semantic = "0.61.2"
oxc_traverse = "0.61.2"

[build-dependencies]
napi-build = "2.0.1"

